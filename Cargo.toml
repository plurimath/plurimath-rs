[package]
name = "plurimath-numeric"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
publish = false
description = "Canonical numeric JSON subset with native and WASM bindings"
include = ["src/**", "tests/**", "fixtures/**", "include/**", "bindings/python/**/*.py", "bindings/typescript/**", "bindings/js/**", "scripts/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE", "package.json"]

[lib]
name = "plurimath_numeric"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde_json = "=1.0.151"
num-bigint = "=0.4.6"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
num-integer = "=0.1.47"

[profile.dev]
debug = 0
incremental = false
