name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  # Source parser corpus tests exceed the job limit with unoptimized code.
  CARGO_PROFILE_TEST_OPT_LEVEL: "2"
jobs:
  test:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Verify a single Parsanol SDK before building
        run: python scripts/check_sdk_graph.py
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests with all supported profiles
        run: cargo test --locked --workspace --all-features --no-fail-fast -- --skip unicode675_rows_match_ruby_source
      - name: Numeric default feature boundary
        run: cargo test --locked -p plurimath-numeric --no-default-features
  q-path-bench:
    # Issue #16: the Scalar refactor must not slow the Q oracle path. Both
    # trees are measured in this one job so runner speed cancels out, and
    # the ratio is checked against the pre-Scalar tree that #31 used.
    name: Q-path bench ratio vs pre-Scalar (0cfb3a8)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_SHA: 0cfb3a8
      # #31 measured 0.975 locally; 1.10 leaves room for shared-runner noise.
      MAX_RATIO: "1.10"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      BENCH_ARGS: --warm-up-time 1 --measurement-time 3 --sample-size 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Prepare the pre-Scalar tree with the #31 bench
        run: |
          git worktree add "$RUNNER_TEMP/q-base" "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/q-base/plurimath-numeric/benches"
          cp plurimath-numeric/benches/evaluate_gum.rs "$RUNNER_TEMP/q-base/plurimath-numeric/benches/"
          cp Cargo.lock "$RUNNER_TEMP/q-base/Cargo.lock"
          printf '\n[dev-dependencies]\ncriterion = "=0.5.1"\n\n[[bench]]\nname = "evaluate_gum"\nharness = false\n' >> "$RUNNER_TEMP/q-base/plurimath-numeric/Cargo.toml"
      - name: Bench the pre-Scalar tree
        working-directory: ${{ runner.temp }}/q-base
        run: cargo bench -p plurimath-numeric --bench evaluate_gum -- $BENCH_ARGS --save-baseline base
      - name: Bench this tree
        run: cargo bench --locked -p plurimath-numeric --bench evaluate_gum -- $BENCH_ARGS --save-baseline head
      - name: Check head/base ratio
        run: python3 scripts/check_q_path_bench.py "$CARGO_TARGET_DIR/criterion" "$MAX_RATIO"
  unicode675:
    name: UnicodeMath 675 shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Source-oracle rows for this shard
        env:
          UNICODE675_SHARD: ${{ matrix.shard }}/8
          UNICODE675_SHOW: "1"
        run: cargo test --locked -p plurimath-facade --all-features --test unicode675 -- --nocapture
  gpu-software-adapter:
    name: GPU harness (software Vulkan adapter)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install software Vulkan adapter (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary
      - name: GPU harness including adapter-gated cases
        env:
          # The harness probes this variable until the wgpu device layer lands.
          PLURIMATH_GPU_ADAPTER: lavapipe
        run: cargo test --locked -p plurimath-gpu --features gpu --test harness -- --include-ignored
