name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  # Source parser corpus tests exceed the job limit with unoptimized code.
  CARGO_PROFILE_TEST_OPT_LEVEL: "2"
jobs:
  test:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Verify a single Parsanol SDK before building
        run: python scripts/check_sdk_graph.py
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests with all supported profiles
        run: cargo test --locked --workspace --all-features --no-fail-fast
      - name: Numeric default feature boundary
        run: cargo test --locked -p plurimath-numeric --no-default-features
