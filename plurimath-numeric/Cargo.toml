[package]
name = "plurimath-numeric"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
publish = false
description = "Canonical numeric, quantity, and GUM JSON evaluator"
include = ["/src/**", "/tests/**", "/fixtures/**", "/include/**", "/bindings/python/**/*.py", "/bindings/typescript/**", "/bindings/js/**", "/scripts/**", "/examples/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/NOTICE", "/package.json"]

[lib]
name = "plurimath_numeric"
crate-type = ["rlib", "cdylib"]

[features]
quantity = ["dep:asciiunits", "dep:unitsml-rs"]

[dependencies]
plurimath-json = { path = "../../../workspace/core-native/plurimath-rs-pma-integrated/transport" }
libm = { version = "=0.2.16", default-features = false }
serde_json = { version = "=1.0.140", features = ["arbitrary_precision", "preserve_order", "unbounded_depth", "raw_value"] }
num-bigint = "=0.4.6"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
num-integer = "=0.1.47"

asciiunits = { version = "=0.1.0", path = "../../../workspace/units-native/asciiunits-rs", optional = true }
unitsml-rs = { version = "=0.1.0", path = "../../../workspace/core-native/pma-dependencies/unitsml-rs", optional = true }

[profile.dev]
debug = 0
incremental = false
